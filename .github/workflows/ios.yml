name: iOS CI

on:
  pull_request:
  push:
    branches: [main]  # 功能分支只经 PR 触发，避免 push+PR 重复消耗 macOS 分钟
  workflow_dispatch:
    inputs:
      screenshots:
        description: "在模拟器中截取三个主页面截图并上传为产物（产物配额紧张，仅按需运行）"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: FXJCore swift test (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: Packages/FXJCore

  ios:
    name: iOS build & test (Simulator)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(rt,x) for rt,xs in d.items() if "iOS" in rt for x in xs if x["name"].startswith("iPhone")]
          c.sort(key=lambda t:t[0])
          print(c[-1][1]["udid"] if c else "")')
          test -n "$UDID" || { echo "No iPhone simulator"; xcrun simctl list; exit 1; }
          echo "Using $UDID"; echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -project FengXiangJia.xcodeproj \
            -scheme FengXiangJia \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DD \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log
      - name: Simulator screenshots (on demand)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.screenshots }}
        run: |
          set -euo pipefail
          UDID=${{ steps.sim.outputs.udid }}
          APP=$(find build/DD/Build/Products -name 'FengXiangJia.app' -path '*iphonesimulator*' | head -1)
          echo "App: $APP"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          mkdir -p screenshots
          for TAB in home tryout plans; do
            xcrun simctl terminate "$UDID" "$BUNDLE" || true
            xcrun simctl launch "$UDID" "$BUNDLE" -FXJSampleOnLaunch -FXJTab "$TAB"
            sleep 8
            xcrun simctl io "$UDID" screenshot "screenshots/$TAB.png"
          done
          ls -la screenshots
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.screenshots }}
        continue-on-error: true
        with:
          name: simulator-screenshots
          path: screenshots/
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true  # 存储配额满时不影响结果
        with:
          name: ios-test-results
          retention-days: 3
          path: |
            build/TestResults.xcresult
            xcodebuild.log
