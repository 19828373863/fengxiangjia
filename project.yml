name: FengXiangJia
options:
  bundleIdPrefix: com.example.fengxiangjia
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
packages:
  FXJCore:
    path: Packages/FXJCore
targets:
  FengXiangJia:
    type: application
    platform: iOS
    sources: [App/FengXiangJia]
    dependencies:
      - package: FXJCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.fengxiangjia.app  # 占位，待正式确定
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 风向家
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
  FengXiangJiaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [App/FengXiangJiaTests]
    dependencies:
      - target: FengXiangJia
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.fengxiangjia.tests
schemes:
  FengXiangJia:
    build:
      targets:
        FengXiangJia: all
        FengXiangJiaTests: [test]
    test:
      targets: [FengXiangJiaTests]
