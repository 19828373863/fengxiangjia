name: FengXiangJia
options:
  bundleIdPrefix: com.example.fengxiangjia
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
packages:
  FXJCore:
    path: Packages/FXJCore
targets:
  FengXiangJia:
    type: application
    platform: iOS
    sources:
      - path: App/FengXiangJia
        excludes: ["*.storekit"]
    dependencies:
      - package: FXJCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.fengxiangjia.app  # 占位，待正式确定
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 风向家
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "用于在支持的设备上扫描房间轮廓与门窗；画面只在本机处理，不上传。"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "用于设置住宅的大致位置以查询当地天气；只保存约 1 公里精度，不上传。"
        TARGETED_DEVICE_FAMILY: "1"
  FengXiangJiaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [App/FengXiangJiaTests]
    dependencies:
      - target: FengXiangJia
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.fengxiangjia.tests
schemes:
  FengXiangJia:
    build:
      targets:
        FengXiangJia: all
        FengXiangJiaTests: [test]
    run:
      storeKitConfiguration: App/FengXiangJia/FengXiangJia.storekit
    test:
      targets: [FengXiangJiaTests]
